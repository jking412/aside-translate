<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>旁译 Aside</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="brand">
      <img src="../assets/icon-32.png" width="32" height="32" alt="" />
      <div><h1>旁译 Aside</h1><p>翻译成中文</p></div>
    </header>
    <main>
      <section class="page-action" aria-label="网页翻译">
        <p id="page-host" class="page-host">当前网页</p>
        <button id="translate" class="primary" type="button" disabled>翻译此页</button>
        <p id="page-status" class="status" role="status" aria-live="polite">正在连接网页…</p>
      </section>
      <section class="features" aria-label="翻译开关">
        <label class="feature" for="auto-translate">
          <span><span class="feature-title">自动翻译网页</span><span class="feature-note">打开网页时自动翻译</span></span>
          <input id="auto-translate" type="checkbox" role="switch" />
        </label>
        <label class="feature" for="youtube-enabled">
          <span><span class="feature-title">YouTube 双语字幕</span><span class="feature-note">原文与中文分行显示</span></span>
          <input id="youtube-enabled" type="checkbox" role="switch" />
        </label>
        <p id="youtube-status" class="status youtube-status" role="status" hidden></p>
        <p id="preference-status" class="status" role="status" aria-live="polite" hidden></p>
      </section>
      <details id="service-details">
        <summary>翻译服务<span id="service-name">微软翻译</span></summary>
        <button id="open-settings" class="text-button" type="button">在独立页面配置</button>
        <p class="help">切去获取密钥时，设置页会保持打开；未保存输入也会保留。</p>
        <div id="service-editor"></div>
      </details>
    </main>
    <script type="module" src="index.js"></script>
  </body>
</html>
